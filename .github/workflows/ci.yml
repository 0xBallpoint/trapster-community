name: CI

# Runs on every pull request (Renovate's included) and on main. Every action is
# pinned to a commit SHA: a tag can be moved to malicious code, a SHA cannot.
# Renovate updates the SHAs with the same 7-day cooldown as the dependencies.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Same uv as the Dockerfile, scripts/python-lock.sh and Renovate
  # (constraints.uv in renovate.json5).
  UV_VERSION: '0.13.9'
  # Use the runner's Python (setup-python), never one downloaded by uv.
  UV_PYTHON_DOWNLOADS: never

jobs:
  lockfile:
    name: uv.lock matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Fails if pyproject.toml was changed without regenerating uv.lock.
      - name: Check uv.lock is up to date
        run: uv lock --check

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Only the "dev" group (ruff), hash-checked from uv.lock.
      - name: Install locked ruff
        run: uv sync --locked --no-build --no-install-project --only-group dev
      # GitHub annotations: findings show on the changed lines of the PR.
      - name: Run ruff
        run: uv run --no-sync ruff check --output-format=github

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Same options as the Dockerfile: hash-checked, wheels only, refuses an
      # out-of-date uv.lock.
      - name: Install locked dependencies
        run: uv sync --locked --no-build --no-install-project
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build .

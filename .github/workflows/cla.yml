name: "CLA Assistant"

# SECURITY: pull_request_target runs with write access to this repository
# (permissions below) even for pull requests from forks, i.e. from anyone.
# This is safe only because nothing here runs code or text from the PR:
# - never add actions/checkout of the PR (head ref or merge ref), and never
#   run its scripts, tests or setup.py;
# - never put PR fields (title, body, branch name, comment body) inside a
#   `run:` step: `${{ ... }}` is pasted into the shell script before it runs.
# Anything that needs the PR's code belongs in ci.yml (pull_request: read-only
# token, no secrets for forks).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: write # this can be 'read' if the signatures are in remote repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@9340315624c6e16cef1f2c63bdeb0f0c49c6f474 # v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PERSONAL_ACCESS_TOKEN: it is only needed to store signatures in
          # another repository, and they are stored in this one.
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://raw.githubusercontent.com/0xBallpoint/trapster-community/main/Contributor%20License%20Agreement.md'
          # branch should not be protected
          branch: 'cla-signatures'
          allowlist: bot*
